<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F5F1EA;color:#3B342C;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:16px;line-height:1.8}
.pf-band{background:#2E3A5C;color:#fff;font-size:15px;text-align:center;padding:10px 16px}

h1{font-weight:400;font-size:clamp(24px,5vw,32px);color:#2E3A5C;line-height:1.5}
.lead{margin:12px 0 32px;color:#5A5046}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}

figcaption b{color:#2E3A5C;font-weight:600}

<div class="pf-band" role="note">これはポートフォリオ用の制作例です。実在する店舗・企業ではありません。</div>
<main>
  <h1>Instagram投稿用バナー 2案（1080×1350）</h1>
  <p class="lead">LPと同じ色・書体で、教室アカウントのフィードに並べる投稿を2つの方向で作りました。人物・道具の写真はAIで作ったイメージです。</p>
  <div class="grid">
    <figure><img src="banners/insta-A.webp" width="1080" height="1350" loading="lazy" alt="Instagramバナー A案：「じぶんで！」を、待ってみる。1〜3歳の親子で通う、少人数モンテッソーリ教室。親子体験レッスン 60分・2,000円（税込）／1回3組まで。体験のご予約は、プロフィールのリンクから。">
      <figcaption><b>A案「『じぶんで！』を、待ってみる。」</b>…LPのファーストビューと同じ言葉。水をそそぐ子と、手を出さずに見守るママの手で「待つ」を見せ、共感で手を止めてもらう想定。</figcaption></figure>
    <figure><img src="banners/insta-B.webp" width="1080" height="1350" loading="lazy" alt="Instagramバナー B案：おうちモンテのヒント。教具は、台所にある。製氷皿・洗濯ばさみ・計量スプーン。※小さな物を使うときは、必ず大人がそばで見守ってください。親子体験レッスン 60分・2,000円（税込）。">
      <figcaption><b>B案「教具は、台所にある。」</b>…「教具は高そう」という悩みに、家の道具の写真で答える。保存されやすい「ヒント」型の投稿。小さな物の誤飲への注意も入れました。</figcaption></figure>
  </div>
