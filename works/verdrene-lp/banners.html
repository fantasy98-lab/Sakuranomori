  <h1>Facebook広告バナー 3案（1200×628）</h1>
  <p class="lead">同じデザインで、見出しのコピーだけを変えた3案です。「若返り」であおらず、不安の強い世代が押しやすい言葉を比べました。人物の写真はAIで作ったイメージです。</p>
  <figure><img src="banners/banner-A.webp" width="1200" height="628" alt="広告バナーA案：決めるのは、聞いてから。説明会での勧誘や、当日の施術はいたしません。">
    <figcaption><b>A案「決めるのは、聞いてから。」</b>…LPのファーストビューと同じ言葉。クリック後の違和感がなく、離脱が少ない想定。</figcaption></figure>
  <figure><img src="banners/banner-B.webp" width="1200" height="628" alt="広告バナーB案：6人だけの席で、医師に聞ける60分。聞きにくいことは、終わったあと個別にどうぞ。">
    <figcaption><b>B案「6人だけの席で、医師に聞ける60分。」</b>…数字で中身がすぐ分かり、少人数の気軽さが伝わる。クリック率が最も高いと予想。</figcaption></figure>
  <figure><img src="banners/banner-C.webp" width="1200" height="628" alt="広告バナーC案：できないことも、先にお話しします。仕組み・リスク・料金まで、医師が説明します。">
    <figcaption><b>C案「できないことも、先にお話しします。」</b>…美容医療に慎重な人ほど目を止める。来院後の信頼が最も高い想定。</figcaption></figure>
